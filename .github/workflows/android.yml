name: Build Jaan Nurie Life APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix folder structure
        run: |
          ls -la
          find . -name "package.json" -type f
          # If files are nested, move them to root
          if [ -f "Jaan-nurie./package.json" ]; then mv Jaan-nurie./* . && mv Jaan-nurie./.* . 2>/dev/null || true; rm -rf Jaan-nurie.; fi
          if [ -f "Jaan-nurie./Jaan-nurie./package.json" ]; then mv Jaan-nurie./Jaan-nurie./* . && mv Jaan-nurie./Jaan-nurie./.* . 2>/dev/null || true; rm -rf Jaan-nurie.; fi
          if [ -f "JaanNurie_InstantAPK/package.json" ]; then mv JaanNurie_InstantAPK/* .; rm -rf JaanNurie_InstantAPK; fi
          ls -la
          cat package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || true

      - name: Copy web assets
        run: |
          npx cap copy android
          npx cap sync android

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaanNurie-Life-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
