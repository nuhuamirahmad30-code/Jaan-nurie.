name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-extract zip if you uploaded it
        run: |
          ls -la
          # Find and extract any zip, even if named .html
          for f in *.zip* *.html; do
            if [ -f "$f" ]; then
              echo "Checking $f"
              unzip -t "$f" > /dev/null 2>&1 && echo "Extracting $f" && unzip -o "$f" && rm "$f" || true
            fi
          done
          # Also check inside subfolders
          find . -name "*.zip*" -type f -exec sh -c 'unzip -o "$1" && rm "$1"' _ {} \; || true
          ls -la
          find . -name "package.json" -type f

      - name: Move package.json to root
        run: |
          FOUND=$(find . -name "package.json" -type f | grep -v node_modules | head -1)
          echo "Found at: $FOUND"
          if [ -n "$FOUND" ]; then
            DIR=$(dirname "$FOUND")
            if [ "$DIR" != "." ]; then
              cp -r $DIR/* . 2>/dev/null || true
              cp -r $DIR/.* . 2>/dev/null || true
            fi
          fi
          ls -la
          cat package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3

      - run: npm install
      - run: npx cap add android || true
      - run: npx cap copy android && npx cap sync android
      - run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JaanNurie-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
