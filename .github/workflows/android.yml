name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean and Create Project From Scratch
        run: |
          rm -f *.zip *.html *.ZIP || true
          rm -rf Jaan-nurie.* JaanNurie* www package.json capacitor.config.json android || true
          mkdir -p www
          cat > package.json <<'EOF'
          {
            "name": "jaan-nurie-life",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^5.7.0",
              "@capacitor/android": "^5.7.0",
              "@capacitor/cli": "^5.7.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.el19.jaannurie.life",
            "appName": "Jaan Nurie Life",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": { "SplashScreen": { "launchShowDuration": 0 } }
          }
          EOF
          cat > www/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <title>Jaan Nurie Life</title>
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          body{background:#0a0a0a;color:#fff;font-family:system-ui;overflow:hidden;height:100vh;width:100vw}
          #game{position:fixed;inset:0;background:radial-gradient(120% 120% at 50% 0%,#1e1b4b 0%,#0a0a0a 60%);display:flex;flex
