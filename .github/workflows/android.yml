name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create fresh project
        run: |
          rm -f *.zip *.html 2>/dev/null || true
          mkdir -p www
          echo '{"name":"jaan-nurie-life","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^5.7.0","@capacitor/android":"^5.7.0","@capacitor/cli":"^5.7.0"}}' > package.json
          echo '{"appId":"com.el19.jaannurie.life","appName":"Jaan Nurie Life","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jaan Nurie Life</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:system-ui;overflow:hidden;height:100vh} .ov{position:fixed;inset:0;z-index:99;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px} @media(orientation:portrait){.ov{display:flex}} .top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #222} .badge{background:#22c55e;color:#000;padding:6px 10px;border-radius:99px;font-weight:900;font-size:11px} .c{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px} .b{padding:16px 28px;border-radius:99px;background:#fff;color:#000;font-weight:900;border:none} </style></head><body><div class="ov"><div style="width:50px;height:90px;border:3px solid #fff;border-radius:14px"></div><div style="font-weight:900">PLEASE ROTATE DEVICE</div><div style="opacity:0.6;font-size:12px">Auto landscape ON</div></div><div style="height:100vh;display:flex;flex-direction:column"><div class="top"><div style="font-weight:900">JAAN ❤️ NURIE LIFE</div><div class="badge">AUTO-ROTATE ON</div></div><div class="c"><div style="font-size:28px;font-weight:900">Abuja Duplex + G-Wagon Ready</div><div style="opacity:0.6">Tap Start forces landscape + fullscreen</div><button class="b" onclick="try{document.documentElement.requestFullscreen()}catch(e){};try{screen.orientation.lock(`landscape`)}catch(e){};alert(`Rotated! Now install as APK`);">TAP TO START</button></div></div></body></html>' > www/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Copy web
        run: npx cap copy android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK - this takes 3 minutes
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JaanNurie-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
