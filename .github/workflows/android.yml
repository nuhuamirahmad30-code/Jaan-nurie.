name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix nested folders and dots
        run: |
          echo "Finding package.json..."
          find . -name "package.json" -type f | head -20
          FOUND=$(find . -name "package.json" -type f | grep -v node_modules | head -1)
          echo "Found: $FOUND"
          if [ -n "$FOUND" ]; then
            DIR=$(dirname "$FOUND")
            echo "Dir: $DIR"
            if [ "$DIR" != "." ]; then
              cp -r $DIR/* . || true
              cp -r $DIR/.* . 2>/dev/null || true
              echo "Moved to root"
            fi
          fi
          ls -la
          cat package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm install
      - name: Add Android
        run: npx cap add android || true
      - name: Copy
        run: npx cap copy android && npx cap sync android
      - name: Make executable
        run: chmod +x android/gradlew
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: JaanNurie-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
